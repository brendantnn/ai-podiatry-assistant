<!DOCTYPE html>
<html>
<head>
  <title>Patient Page</title>
  <style>
    #chatbox {
      height: 300px;
      overflow-y: scroll;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
    }
    .user { color: blue; margin: 5px 0; }
    .bot { color: green; margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Patient Chatbot</h2>
  <div id="chatbox"></div>  <!-- Message shown to user, is updated in patient.js -->

  <input id="message" placeholder="Type your message..." />

  <button onclick="sendMessage()">Send</button> <!-- When user click on send button, run sendMessage() function in patient.js-->

  <script src="patient.js"></script>
</body>
</html>
