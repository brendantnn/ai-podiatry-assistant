<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Page Not Found</title>
  <link rel="stylesheet" href="template.css" />
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fa;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 5rem;
      color: #0078d7;
      margin: 0;
    }
    h2 {
      margin-top: 0.5rem;
      font-weight: normal;
      color: #555;
    }
    p {
      margin-top: 1rem;
      color: #666;
    }
    a.button {
      margin-top: 2rem;
      text-decoration: none;
      background: #0078d7;
      color: white;
      padding: 0.8rem 1.6rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    a.button:hover {
      background: #005ea3;
    }
    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for doesn't exist or may have been moved.</p>
    <a class="button" href="/login.html">Go Back to Login</a>
  </main>
  <footer>© 2025 ITP Group 21 — Singapore Institute of Technology</footer>
</body>
</html>
