name: Deploy to Firebase (Hosting + Functions)

on:
  push:
    branches:
      - main      # change to 'master' or your branch name if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # matches your Firebase Functions runtime

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install root dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Install Functions dependencies
        run: |
          if [ -d functions ]; then
            cd functions
            npm install
          fi

      - name: Deploy to Firebase (Hosting + Functions)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only "hosting,functions" --project itp-grp21 --non-interactive
